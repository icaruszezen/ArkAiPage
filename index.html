<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- 标题和摘要默认英文；页面打开后 src/i18n.ts 按访客选的语言改写 -->
    <title>
      ArkAI | Enterprise LLM Services, AI Agents and Computer Vision
    </title>
    <meta
      name="description"
      content="ArkAI builds AI solutions for businesses: LLM services, AI agent design and computer vision, with private deployment and support from discovery and prototyping to delivery and operations."
    />
    <!--
      规范链接由 src/i18n.ts 按当前语言写上（各语言的页面各是各的地址）；
      各语言页面的 hreflang 和 og:locale:alternate 由 vite.config.ts 照语言表生成
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ArkAI" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://arkai.vip/" />
    <meta
      property="og:title"
      content="ArkAI | Enterprise LLM Services, AI Agents and Computer Vision"
    />
    <meta
      property="og:description"
      content="LLM services, AI agent design and computer vision solutions: put AI to work."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      先定好亮暗主题再画页面，避免首屏闪一下亮色：
      读用户上次的选择（组件库的 useTheme 存在 ef-theme 里），没有就跟随系统。
      语言不用在这里定：页面是脚本画出来的，src/i18n.ts 在画第一帧之前就把 lang 写好了
    -->
    <script>
      (function () {
        var d = document.documentElement,
          m = false;
        try {
          var t = localStorage.getItem("ef-theme");
          m =
            t === "dark" ||
            ((t === null || t === "system") &&
              matchMedia("(prefers-color-scheme: dark)").matches);
        } catch (e) {}
        d.dataset.theme = m ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 1.5rem">
        ArkAI builds LLM services, AI agents and computer vision solutions for
        businesses. Please enable JavaScript to view the full page.
      </p>
      <p lang="zh-CN" style="padding: 0 1.5rem 1.5rem">
        ArkAI 为企业提供 AI 大模型服务、AI Agent 设计与 AI 视觉解决方案。请开启
        JavaScript 浏览完整页面。
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
